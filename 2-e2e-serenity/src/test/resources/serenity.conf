serenity {
  project.name = "Reto TCS - E2E Flujo de compra Demoblaze"
  # Captura de pantalla después de cada paso (queda como evidencia en el reporte)
  take.screenshots = AFTER_EACH_STEP
  logging = VERBOSE
  console.colors = true
}

webdriver {
  driver = chrome
  # Espera implícita de 10 s para la localización de elementos
  timeouts.implicitlywait = 10000
  wait.for.timeout = 15000
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["start-maximized", "incognito", "remote-allow-origins=*",
              "disable-dev-shm-usage", "no-sandbox", "disable-gpu",
              "disable-infobars", "disable-popup-blocking"]
    }
  }
}

# Ejecutar sin interfaz gráfica:  mvn clean verify -Dheadless.mode=true
headless.mode = false

environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com"
  }
}
